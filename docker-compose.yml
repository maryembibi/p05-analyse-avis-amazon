# P05 - Cluster Hadoop pseudo-distribue (HDFS + YARN) pour poste 12 Go RAM
# Lancement : docker compose up -d      Arret (donnees conservees) : docker compose stop
# Interfaces : HDFS http://localhost:9870   YARN http://localhost:8088
name: p05-hadoop

services:
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    env_file:
      - ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hdfs/name"   # formate HDFS seulement au premier demarrage
    volumes:
      - namenode-data:/tmp                   # metadonnees HDFS conservees entre redemarrages
      - ./:/projet                           # dossier C:\big_data_proj visible dans le conteneur

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop.env
    volumes:
      - datanode-data:/tmp                   # blocs HDFS conserves entre redemarrages
    depends_on:
      - namenode

  resourcemanager:
    image: apache/hadoop:3.3.6
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode

  nodemanager:
    image: apache/hadoop:3.3.6
    container_name: nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./hadoop.env
    depends_on:
      - resourcemanager

volumes:
  namenode-data:
  datanode-data:
